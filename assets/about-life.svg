<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img"><title>Sparsh Shukla — GitHub profile</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152d"/><stop offset="1" stop-color="#070b16"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1b4c86" opacity=".35"/></pattern><filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter></defs><rect width="100%" height="100%" rx="20" fill="url(#bg)"/><rect width="100%" height="100%" rx="20" fill="url(#dots)"/><rect x="14" y="14" width="560" height="330" rx="16" fill="#030d20" fill-opacity=".88" stroke="#123768" stroke-width="1.5"/><rect x="590" y="14" width="596" height="330" rx="16" fill="#030d20" fill-opacity=".88" stroke="#123768" stroke-width="1.5"/><text x="38" y="52" fill="#42d9ff" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" >✦  ABOUT ME</text><text x="38" y="91" fill="#f3f6ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" >I'm a Computer Science Engineering student at the Institute of</text><text x="38" y="116" fill="#f3f6ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" >Engineering and Technology, building a foundation in software</text><text x="38" y="141" fill="#f3f6ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" >development, computer science, and modern technologies.</text><text x="38" y="180" fill="#f3f6ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" >I enjoy turning ideas into practical projects, solving problems,</text><text x="38" y="205" fill="#f3f6ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" >and lear