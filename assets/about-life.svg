<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc"><title id="title">About Sparsh and interests</title><desc id="desc">Animated GitHub profile graphic for Sparsh Shukla. Self-contained; no external assets.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#111c35"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7890c0" opacity=".22"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:Arial,Helvetica,sans-serif} .in{opacity:0;animation:rise .9s ease-out .2s forwards} .in2{opacity:0;animation:rise .9s ease-out .55s forwards} .pulse{animation:pulse 3s ease-in-out infinite} @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}} @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}} @media(prefers-reduced-motion:reduce){.in,.in2,.pulse{animation:none;opacity:1}}</style><rect width="1000" height="260" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="998" height="258" rx="21" fill="none" stroke="url(#line)" stroke-opacity=".5"/><text x="38" y="47" fill="#247bff" font-size="12" font-weight="700" letter-spacing="2">01 / ABOUT &amp; LIFE</text><text x="38" y="87" fill="#f4f7ff" font-size="27" font-weight="700">Curious mind. Practical builder.</text><text x="38" y="120" fill="#aab5cf" font-size="15">I learn by making projects, exploring new tools,</text><text x="38" y="143" fill="#aab5cf" font-size="15">and collaborating with the open-source community.</text><g transform="translate(38 176)"><rect width="210" height="42" rx="12" fill="#101c34" stroke="#273d65"/><text x="16" y="26" fill="#f4f7ff" font-size="13">01  Build useful projects</text></g><g transform="translate(267 176)"><rect width="210" height="42" rx="12" fill="#101c34" stroke="#273d65"/><text x="16" y="26" fill="#f4f7ff" font-size="13">02  Learn continuously</text></g><g transform="translate(496 176)"><rect width="210" height="42" rx="12" fill="#101c34" stroke="#273d65"/><text x="16" y="26" fill="#f4f7ff" font-size="13">03  Contribute openly</text></g><g transform="translate(755 42)"><rect width="205" height="174" rx="18" fill="#0d162a" stroke="#247bff" stroke-opacity=".6"/><text x="20" y="29" fill="#ff354f" font-size="11" letter-spacing="1.5">CURRENT INTERESTS</text><g class="pulse"><text x="20" y="65" fill="#f4f7ff" font-size="16">⌘  Coding</text><text x="20" y="101" fill="#f4f7ff" font-size="16">✦  New technology</text><text x="20" y="137" fill="#f4f7ff" font-size="16">↗  Open source</text></g></g></svg>